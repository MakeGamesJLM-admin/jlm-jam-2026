<!doctype html>
<html lang="$lang" dir="$direction">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#cffbf7">
  <meta name="description" content="$meta">
  <meta property="og:type" content="website">
  <meta property="og:title" content="$title">
  <meta property="og:description" content="$meta">
  <link rel="alternate" hreflang="he" href="$hebrew">
  <link rel="alternate" hreflang="en" href="$english">
  <link rel="icon" href="${root}assets/cross.webp" type="image/webp">
  <link rel="stylesheet" href="${root}style.css">
  <title>$title</title>
</head>
<body>
  <a href="#main" class="skip">$skip</a>
  <div class="hero-shell">
    <header class="header wrap">
      <a class="brand" href="https://makegamesjlm.com/" aria-label="MakeGamesJLM">
        <img src="${root}assets/makegamesjlm.webp" alt="MakeGamesJLM" width="74" height="50">
      </a>
      <nav class="header-nav">
        <a href="#about">$aboutNav</a>
        <a href="#faq">$faqNav</a>
      </nav>
      <nav class="language" aria-label="$language" dir="ltr">
        <a href="$english" lang="en" hreflang="en" $english_current>EN</a>
        <a href="$hebrew" lang="he" hreflang="he" $hebrew_current>עברית</a>
      </nav>
    </header>

  </div>

  <main id="main">
    <section class="hero-shell">
      <div class="wrap hero">
        <div class="hero-copy">
          <p class="eyebrow">$label</p>
          <h1>$hero</h1>
          <p class="intro">$intro</p>
          <a class="cta" href="$form">$signup</a>
          <p class="cost">$cost</p>
        </div>
        <div class="hero-art" lang="en" dir="ltr" role="img" aria-label="JLM JAM 2026">
          <img class="sprite handheld" src="${root}assets/handheld.webp" alt="">
          <img class="sprite clamshell" src="${root}assets/clamshell.webp" alt="">
          <img class="sprite disc" src="${root}assets/disc.webp" alt="">
          <img class="sprite remote" src="${root}assets/remote.webp" alt="">
          <img class="sprite square" src="${root}assets/square.webp" alt="">
          <img class="sprite circle" src="${root}assets/circle.webp" alt="">
          <img class="sprite triangle" src="${root}assets/triangle.webp" alt="">
          <img class="sprite cross" src="${root}assets/cross.webp" alt="">
          <div class="wordmark">
            <img class="panel" src="${root}assets/title-panel.webp" alt="">
            <div class="letters">
              <img class="letter-j" src="${root}assets/title-j.webp" alt="">
              <img class="letter-l" src="${root}assets/title-l.webp" alt="">
              <img class="letter-m" src="${root}assets/title-m.webp" alt="">
              <img class="letter-jam" src="${root}assets/title-jam.webp" alt="">
            </div>
            <span class="year">2026</span>
          </div>
        </div>
      </div>
    </section>

    <aside class="event-strip">
      <div class="event-grid wrap">
        <div class="event">
          <img src="${root}assets/calendar.webp" alt="" width="30" height="30">
          <div><strong>$dates</strong><span>$hours</span></div>
        </div>
        <div class="event">
          <img src="${root}assets/pin.webp" alt="" width="24" height="30">
          <div><strong>$venue</strong><a href="https://www.google.com/maps/search/?api=1&amp;query=Hansen+House+14+Gedalyahu+Alon+Jerusalem">$address</a></div>
        </div>
      </div>
    </aside>

    <div class="wrap details-wrap">
      <section class="about" id="about">
        <div class="about-copy">
          <h2>$about</h2>
          <p class="lead">$hackathon</p>
          <p>$flow</p>
        </div>
        <div class="first">
          <img src="${root}assets/handheld.webp" alt="" width="60" height="64" loading="lazy">
          <h3>$firstTitle</h3>
          <p>$first</p>
        </div>
      </section>

      <section class="faq" id="faq">
        <h2>$faq</h2>
        <div class="questions">$questions</div>
        <p class="schedule">$schedule</p>
      </section>
    </div>

  </main>

  <footer>
    <div class="closing">
      <div class="wrap closing-inner">
        <h2>$farewell</h2>
        <a class="cta" href="$form">$signup</a>
        <p class="cost">$cost</p>
      </div>
      <img class="skyline" src="${root}assets/skyline.webp" alt="" loading="lazy">
    </div>
    <div class="footer-info">
      <div class="wrap footer-grid">
        <img src="${root}assets/makegamesjlm.webp" alt="MakeGamesJLM" width="70" height="47" loading="lazy">
        <p>$organized</p>
        <div class="footer-links">
          <a href="https://makegamesjlm.com/">$community</a>
          <a href="mailto:makegamesjlm@gmail.com">$contact</a>
        </div>
      </div>
    </div>
  </footer>
</body>
</html>
