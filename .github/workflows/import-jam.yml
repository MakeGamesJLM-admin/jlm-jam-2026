name: Import the jam landing page
on:
  push:
    paths:
      - .github/workflows/import-jam.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy the published artwork and generate both pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/assets
          for file in assets/calendar.webp assets/circle.webp assets/clamshell.webp assets/cross.webp assets/disc.webp assets/handheld.webp assets/makegamesjlm.webp assets/pin.webp assets/remote.webp assets/skyline.webp assets/square.webp assets/title-j.webp assets/title-jam.webp assets/title-l.webp assets/title-m.webp assets/title-panel.webp assets/triangle.webp style.css; do
            curl --fail --silent --show-error --location --retry 3 'https://jlm-jam-2026.made-in-jlm-6151.chatgpt.site/'"$file" --output "docs/$file"
          done
          printf %s '' | base64 -d > 'README.md'
          printf %s '' | base64 -d > 'build.py'
          printf %s '' | base64 -d > 'content.json'
          printf %s '' | base64 -d > 'page.html'
          touch docs/.nojekyll
          python3 build.py
          git add README.md build.py content.json page.html docs
          test "$(git hash-object 'README.md')" = '7ef8a2b10d024c142448fa0a1478b084e4411920'
          test "$(git hash-object 'build.py')" = '90d6a72d24c37eea88adcdf2282240561d94e36a'
          test "$(git hash-object 'content.json')" = '69357019bd71930aa4ecf1a07c36f98bde3ab789'
          test "$(git hash-object 'docs/.nojekyll')" = 'e69de29bb2d1d6434b8b29ae775ad8c2e48c5391'
          test "$(git hash-object 'docs/assets/calendar.webp')" = '733fa3b2e4f0ed6dc77e4fdb7a364aad9a448f56'
          test "$(git hash-object 'docs/assets/circle.webp')" = 'ff1948f841ec9e8212155cfe3be3e4c7b8d11f16'
          test "$(git hash-object 'docs/assets/clamshell.webp')" = '14fd842fd507346f158ef26ed85cbde85c4b70b1'
          test "$(git hash-object 'docs/assets/cross.webp')" = '4968adf2781609405bfbce0a343541a3fffa592a'
          test "$(git hash-object 'docs/assets/disc.webp')" = '94c5c2d290d55c34cf61e5c48ed8f1ea9617157a'
          test "$(git hash-object 'docs/assets/handheld.webp')" = '13e1258586ed20ba1f10d4cd7d702b64f077dd9a'
          test "$(git hash-object 'docs/assets/makegamesjlm.webp')" = '9abebb1dc4f3ce063d2b1baf5a8097d4e709bf95'
          test "$(git hash-object 'docs/assets/pin.webp')" = 'e6a065196f46dc32039a598edbb28c4e29d2c2f2'
          test "$(git hash-object 'docs/assets/remote.webp')" = '21e58a0e686403977f6eb47c6ecf950b80f45a65'
          test "$(git hash-object 'docs/assets/skyline.webp')" = '1332ed65ed574711b1979e7b79b3917e6858cb84'
          test "$(git hash-object 'docs/assets/square.webp')" = '1a2e7a7c839e44554937996949924f8da03421e5'
          test "$(git hash-object 'docs/assets/title-j.webp')" = '13adebf03fcb87404d3351474aea46df26f49f3a'
          test "$(git hash-object 'docs/assets/title-jam.webp')" = '68b9ed6d8cda3dd464fd0c87c936fd01742936d8'
          test "$(git hash-object 'docs/assets/title-l.webp')" = 'de41bf0e4da4e4e84a9f78512094932f7dd7842b'
          test "$(git hash-object 'docs/assets/title-m.webp')" = '5ccf3fdd1a49b389b512956d5687d3fb8b942b0a'
          test "$(git hash-object 'docs/assets/title-panel.webp')" = '31e6666380b0f2daf87d04d69fd7c0ed5804cbc5'
          test "$(git hash-object 'docs/assets/triangle.webp')" = 'd8098d736f59f88207ae943113cc77d127a2e5f1'
          test "$(git hash-object 'docs/en/index.html')" = '0a1d194b0b99e756cb14e1b423de9ff7e355542f'
          test "$(git hash-object 'docs/index.html')" = '7831fe5da8e9cf6143ad1914ada14f5fd6d512ff'
          test "$(git hash-object 'docs/style.css')" = '47e08e35b76bc3a8b0763024a925f62d915f6130'
          test "$(git hash-object 'page.html')" = '15332bd4b24fa428fbfe9c722e5938448c9a126c'
          git -c user.name='MakeGamesJLM' -c user.email='makegamesjlm@users.noreply.github.com' commit -m 'Build bilingual Hanukkah Jam landing page'
          git push origin HEAD:main
